image: eclipse-temurin:11-jdk

stages:
  - test
  - build
  - deploy

variables:
  CI_REGISTRY: registry.gitlab.com
  IMAGE_BASE: registry.gitlab.com/eladyesh/flink-springboot-demo/demo

before_script:
  - export EFFECTIVE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
  - DEPLOY_INTEGRATION=$(grep -oPm1 "(?<=<deploy.integration>)[^<]+" pom.xml || echo "false")
  - echo "Deploy integration is equal to $DEPLOY_INTEGRATION"
  - export DEPLOY_INTEGRATION
  - chmod +x ./mvnw

run-tests:
  stage: test
  script:
    - ./mvnw test
  rules:
    - when: always

build-and-push:
  stage: build
  script:
    - |
      if [ "$CI_COMMIT_TAG" ] || [ "$DEPLOY_INTEGRATION" = "true" ]; then
        ./mvnw clean package -DskipTests
        docker build -t $IMAGE_BASE:$EFFECTIVE_TAG .
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
        docker push $IMAGE_BASE:$EFFECTIVE_TAG
      else
        echo "Skipping build-and-push because conditions not met"
      fi
  rules:
    - when: always

deploy-integration:
  stage: deploy
  script:
    - |
      if [ "$DEPLOY_INTEGRATION" = "true" ]; then
        echo "Deploying to integration environment with image $IMAGE_BASE:$EFFECTIVE_TAG"
      else
        echo "Skipping deploy-integration: DEPLOY_INTEGRATION=$DEPLOY_INTEGRATION"
        exit 0
      fi
  environment:
    name: integration
  rules:
    - when: always

deploy-production:
  stage: deploy
  script:
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        echo "Deploying to production environment with image $IMAGE_BASE:$EFFECTIVE_TAG"
      else
        echo "Skipping deploy-production because this is not a tagged commit"
        exit 0
      fi
  environment:
    name: production
  rules:
    - when: always
